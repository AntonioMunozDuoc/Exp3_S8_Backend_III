spring.application.name=bff-mobile

server.port=8082

# API interna Banco XYZ
core.api.base-url=${CORE_API_URL:http://localhost:8080}
core.api.connect-timeout-ms=2000
core.api.read-timeout-ms=3000

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Resilience4j - Retry y Bulkhead (bean ResilientCall) alrededor del Circuit Breaker
resilience.retry.max-attempts=3
resilience.retry.wait-ms=300
resilience.bulkhead.max-concurrent-calls=10
resilience.bulkhead.max-wait-ms=100

# Resilience4j - Core API (mismo perfil en los tres BFF)
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

resilience4j.circuitbreaker.instances.coreApi.register-health-indicator=true
resilience4j.circuitbreaker.instances.coreApi.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.coreApi.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreApi.sliding-window-size=3
resilience4j.circuitbreaker.instances.coreApi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.coreApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreApi.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.coreApi.permitted-number-of-calls-in-half-open-state=1
resilience4j.circuitbreaker.instances.coreApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.coreApi.ignore-exceptions=com.bancoxyz.bff.mobile.exception.MobileRecursoNoEncontradoException,org.springframework.web.client.HttpClientErrorException

# HTTPS (SSL_ENABLED=false en Docker: el trafico es interno a la red del compose)
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz-local

# OAuth2 - Resource Server: valida los JWT emitidos por el auth-server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# OAuth2 - Cliente: identidad de este BFF para llamar al Core API (client_credentials)
oauth2.client.token-uri=${AUTH_TOKEN_URI:http://localhost:9000/oauth2/token}
oauth2.client.client-id=bff-mobile
oauth2.client.client-secret=${BFF_MOBILE_SECRET:bff-mobile-secret-dev}
oauth2.client.scope=core.access
