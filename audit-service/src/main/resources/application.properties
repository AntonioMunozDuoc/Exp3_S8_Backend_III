spring.application.name=audit-service
spring.main.web-application-type=none

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=banco-auditoria
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

banco.kafka.topic.movimientos=banco.movimientos

auditoria.instancia=${AUDIT_INSTANCE:auditoria-1}

# Un mensaje se confirma (commit de offset) despues de procesarlo
spring.kafka.listener.ack-mode=record

# Idempotencia: ventana de deduplicacion de eventId y tamano maximo en memoria
auditoria.idempotencia.ttl-horas=24
auditoria.idempotencia.max-eventos=100000
