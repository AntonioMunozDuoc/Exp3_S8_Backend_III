spring.application.name=bank-core-api

# Config Server (en Docker: CONFIG_SERVER_URL=http://config-server:8888)
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=8080

# Base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banco_xyz_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datos iniciales (data.sql). Solo se ejecutan si SQL_INIT_MODE=always (docker-compose).
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=true

# Valores que dependen del entorno (host de cada servicio): se inyectan por
# variables de entorno. El resto de la configuracion vive en config-repo.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# OAuth2 - Resource Server (el issuer debe coincidir con el del auth-server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:9000}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

# Actuator / observabilidad
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.sql.init.encoding=UTF-8
