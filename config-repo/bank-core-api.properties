server.port=8080
banco.xyz.config.origen=Config Server Semana 8

management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always

# Kafka - arquitectura orientada a eventos
# (bootstrap-servers y URL de Eureka dependen del entorno: ver application.properties del Core)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# El payload es JSON ya validado contra el contrato (contracts/movimiento-evento.v1.schema.json)
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Productor idempotente: evita duplicados por reintentos internos del cliente Kafka
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
# Si Kafka cae, el envio no debe bloquear la respuesta HTTP mas de 3 segundos
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=10000

banco.kafka.topic.movimientos=banco.movimientos

# Resilience4j - publicacion de eventos (continuidad operativa si Kafka no responde)
spring.cloud.circuitbreaker.resilience4j.disable-time-limiter=true

resilience4j.circuitbreaker.instances.kafkaPublisher.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaPublisher.allow-health-indicator-to-fail=false
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaPublisher.sliding-window-size=5
resilience4j.circuitbreaker.instances.kafkaPublisher.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaPublisher.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaPublisher.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.kafkaPublisher.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaPublisher.automatic-transition-from-open-to-half-open-enabled=true
