spring.security.oauth2.authorizationserver.client.bff-web.registration.client-authentication-methods[0]=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-web.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.bff-web.registration.scopes[0]=core.access

