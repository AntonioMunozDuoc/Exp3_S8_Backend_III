spring.security.oauth2.authorizationserver.client.atm-app.registration.authorization-grant-types[0]=client_credentials
spring.security.oauth2.authorizationserver.client.atm-app.registration.scopes[0]=atm.access

spring.security.oauth2.authorizationserver.client.bff-web.registration.client-id=bff-web
